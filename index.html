<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raul Fabian</title>
<meta name="description" content="Raul Fabian — Dev. Builder. Creator.">
<meta property="og:title" content="Raul Fabian">
<meta property="og:description" content="Dev. Builder. Creator.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Krona+One&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------
     Troque a URL abaixo por "assets/bg.jpg" depois de baixar a arte
     (https://raulfabian.carrd.co/assets/images/bg.jpg) para o seu
     projeto, assim o site fica 100% independente do Carrd.
  ----------------------------------------------------------------*/
  :root{
    --bg-art: url("https://raulfabian.carrd.co/assets/images/bg.jpg");
    --ink: #000;
    --page: #141414;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--page);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:flex-start;
    min-height:100svh;
    padding:40px 0 40px 45px;
  }
  .stack{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    margin:auto 0;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:#f2f0ec var(--bg-art) center/cover no-repeat;
    z-index:-1;
  }

  .card{
    position:relative;
    width:381px;
    min-height:485px;
    padding:60px 58px;
    border-radius:46px;
    background:rgba(0,0,0,.03);
    -webkit-backdrop-filter:blur(19.8px);
    backdrop-filter:blur(19.8px);
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  h1{
    margin:0 0 15px;
    font-size:44px;
    line-height:55px;
    font-weight:500;
    letter-spacing:-.73px;
  }

  .tagline{
    margin:0 0 26px;
    font-size:15px;
    line-height:26px;
    font-weight:400;
  }

  .socials{
    display:flex;
    gap:22px;
    margin:0 0 30px;
    padding:0;
    list-style:none;
  }
  .socials a{
    display:flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    border:1px solid rgba(0,0,0,.75);
    border-radius:50%;
    color:#000;
    transition:transform .18s ease, background .18s ease, color .18s ease;
  }
  .socials a:hover{background:#000;color:#fff;transform:translateY(-2px)}
  .socials svg{width:13px;height:13px;display:block}

  .label{
    margin:0 0 14px;
    font-size:15px;
    line-height:26px;
    font-weight:400;
  }

  .buttons{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:178px;
    padding:5px 18px;
    border-radius:37px;
    font-size:18px;
    line-height:1.4;
    text-decoration:none;
    transition:transform .18s ease, filter .18s ease;
  }
  .btn:hover{transform:translateY(-2px);filter:brightness(1.06)}

  .btn--rtx{
    font-family:"Krona One",sans-serif;
    color:#000;
    background-color:#db00ff;
    background-image:linear-gradient(185deg,#4200ff 0%,rgba(219,0,255,.01) 100%);
  }
  .btn--arena{
    font-family:"Inter",sans-serif;
    color:#faff00;
    background:#005e1a;
  }

  a{text-decoration:none}

  .cv-panel{
    display:none;
    width:381px;
    margin-top:20px;
    padding:24px;
    border-radius:28px;
    background:rgba(0,0,0,.03);
    -webkit-backdrop-filter:blur(19.8px);
    backdrop-filter:blur(19.8px);
  }
  .cv-panel.is-open{display:block}
  .cv-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 14px;
  }
  .cv-panel-head span{font-size:15px;font-weight:500}
  .cv-panel-close{
    background:none;
    border:none;
    cursor:pointer;
    font-size:20px;
    line-height:1;
    color:#000;
    padding:0;
  }
  .cv-panel iframe{
    width:100%;
    height:520px;
    border:0;
    border-radius:14px;
    background:#fff;
  }

  @media (max-width:820px){
    body{padding:32px 20px;justify-content:center}
    .card{width:100%;max-width:381px;padding:48px 34px}
    h1{font-size:36px;line-height:44px}
    .btn{width:100%}
    .cv-panel{width:100%;max-width:381px}
  }
</style>
</head>
<body>

  <div class="stack">
  <main class="card">
    <h1>Raul Fabian,<br>26 Anos</h1>
    <p class="tagline">Dev. Builder. Creator</p>

    <ul class="socials">
      <li><a href="assets/CV_Raul_Arevalo.pdf" id="cv-link" aria-label="Currículo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </a></li>
      <li><a href="https://www.instagram.com/raultfabian/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      </a></li>
      <li><a href="mailto:rafabi_an@hotmail.com" aria-label="E-mail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
      </a></li>
      <li><a href="https://www.linkedin.com/in/raul-fabian-arevalo-tejedo-a04a90289/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.75V21h-4v-5.6c0-1.34-.03-3.06-1.9-3.06-1.9 0-2.2 1.45-2.2 2.96V21H9z"/></svg>
      </a></li>
      <li><a href="https://github.com/TrueMallory" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      </a></li>
    </ul>

    <p class="label">Meus Projetos</p>

    <div class="buttons">
      <a class="btn btn--rtx" href="https://rtxmkt.carrd.co/" target="_blank" rel="noopener">RTX MKT</a>
      <a class="btn btn--arena" href="https://autopostoarena.carrd.co/" target="_blank" rel="noopener">Auto Posto Arena</a>
    </div>
  </main>

  <section class="cv-panel" id="cv-panel">
    <div class="cv-panel-head">
      <span>Currículo</span>
      <button type="button" class="cv-panel-close" id="cv-panel-close" aria-label="Fechar">&times;</button>
    </div>
    <iframe id="cv-iframe" src="" title="Currículo"></iframe>
  </section>
  </div>

  <script>
    var cvLink = document.getElementById('cv-link');
    var cvPanel = document.getElementById('cv-panel');
    var cvIframe = document.getElementById('cv-iframe');
    var cvClose = document.getElementById('cv-panel-close');
    var cvSrc = cvLink.getAttribute('href');

    cvLink.addEventListener('click', function(e){
      e.preventDefault();
      var isOpen = cvPanel.classList.toggle('is-open');
      if(isOpen){
        if(!cvIframe.getAttribute('src')) cvIframe.setAttribute('src', cvSrc);
        cvPanel.scrollIntoView({behavior:'smooth', block:'start'});
      }
    });

    cvClose.addEventListener('click', function(){
      cvPanel.classList.remove('is-open');
    });
  </script>
</body>
</html>
